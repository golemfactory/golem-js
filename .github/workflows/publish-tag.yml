name: Publish Test Version

run-name: Publish ${{ inputs.version }} with npm tag ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to publish (must not exist on npm)"
        required: true
        default: "3.10.0-oidc.1"
      tag:
        description: "npm dist-tag to assign without changing latest"
        required: true
        default: "oidc-test"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install latest npm
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version

      - name: Build the SDK for release
        run: npm run build

      - name: Publish to npm with OIDC
        env:
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
